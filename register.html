<!DOCTYPE html>
<html lang="en">
<head>
      <link rel="stylesheet" href="style.css">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MEDSYS – Register</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
</head>
<body>
  <div class="card">
    <div class="card-header">
      <div class="logo">
        <div class="cross"></div>
        <span class="brand">MEDSYS</span>
        <div class="header-right">
          <div class="header-title">New Account</div>
        </div>
      </div>
      <div class="sub">Medical Information System</div>
    </div>

    <div class="card-body">
      <form action="#" method="post">

        <!-- Personal Info -->
        <div class="section-title">Personal Information</div>

        <div class="grid-2">
          <div class="field">
            <label for="firstname">First Name</label>
            <input type="text" id="firstname" name="firstname" placeholder="John" required>
          </div>
          <div class="field">
            <label for="lastname">Last Name</label>
            <input type="text" id="lastname" name="lastname" placeholder="Doe" required>
          </div>
        </div>

        <div class="field">
          <label for="email">Email Address</label>
          <input type="email" id="email" name="email" placeholder="john.doe@hospital.org" required>
        </div>

        <div class="grid-2">
          <div class="field">
            <label for="phone">Phone</label>
            <input type="tel" id="phone" name="phone" placeholder="+1 (555) 000-0000">
          </div>
          <div class="field">
            <label for="role">Role</label>
            <select id="role" name="role" required>
              <option value="" disabled selected>Select role</option>
              <option>Doctor</option>
              <option>Nurse</option>
              <option>Administrator</option>
              <option>Pharmacist</option>
              <option>Lab Technician</option>
              <option>Receptionist</option>
            </select>
          </div>
        </div>

        <!-- Account Info -->
        <div class="section-title spacer">Account Credentials</div>

        <div class="field">
          <label for="username">Username</label>
          <input type="text" id="username" name="username" placeholder="Choose a username" required>
        </div>

        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" placeholder="Min. 8 characters" required oninput="updateStrength(this.value)">
          <div class="strength-bar"><div class="strength-fill" id="strength-fill"></div></div>
          <div class="password-hint" id="strength-label">Enter a password</div>
        </div>

        <div class="field">
          <label for="confirm">Confirm Password</label>
          <input type="password" id="confirm" name="confirm" placeholder="Re-enter password" required>
        </div>
        <div class="terms">
          <input type="checkbox" id="terms" required>
          <label for="terms" style="text-transform:none; letter-spacing:0; font-weight:400; color:#666;">
            I agree to the <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a> of MEDSYS
          </label>
        </div>

        <button type="submit" class="btn">Create Account</button>
      </form>

      <div class="divider">
        <div class="divider-line"></div>
        <span class="divider-text">already registered?</span>
        <div class="divider-line"></div>
      </div>

      <div class="login-text">
        Already have an account? <a href="login.html">Sign in here</a>
      </div>
    </div>
  </div>

  <script>
    function updateStrength(val) {
      const fill = document.getElementById('strength-fill');
      const label = document.getElementById('strength-label');
      let score = 0;
      if (val.length >= 8) score++;
      if (/[A-Z]/.test(val)) score++;
      if (/[0-9]/.test(val)) score++;
      if (/[^A-Za-z0-9]/.test(val)) score++;
      const levels = [
        { w: '0%',   bg: '#eee',    text: 'Enter a password' },
        { w: '25%',  bg: '#e74c3c', text: 'Weak' },
        { w: '50%',  bg: '#f39c12', text: 'Fair' },
        { w: '75%',  bg: '#3498db', text: 'Good' },
        { w: '100%', bg: '#2ecc71', text: 'Strong' },
      ];
      const l = val.length === 0 ? levels[0] : levels[score] || levels[1];
      fill.style.width = l.w;
      fill.style.background = l.bg;
      label.textContent = l.text;
      label.style.color = l.bg === '#eee' ? '#aaa' : l.bg;
    }
  </script>
</body>
</html>
